{{- if .Values.monitoring.prometheusEndpoint }}
apiVersion: v1
kind: Service
metadata:
  name: akernel-adx-coordinator-metrics
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: akernel-adx-coordinator
  ports:
    - name: metrics
      port: 19090
      targetPort: 19090
---
apiVersion: v1
kind: Service
metadata:
  name: akernel-adx-node-metrics
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: node
  ports:
    - name: metrics
      port: 19091
      targetPort: 19091
---
apiVersion: v1
kind: Service
metadata:
  name: akernel-adx-ingress-metrics
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: akernel-adx-ingress-api
  ports:
    - name: metrics
      port: 18080
      targetPort: 18080
---
apiVersion: v1
kind: Service
metadata:
  name: akernel-adx-relay-metrics
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: node
  ports:
    - name: metrics
      port: 18443
      targetPort: 18443
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: akernel-adx-native-metrics
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: akernel-adx-native-metrics
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [endpoints, pods, services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: akernel-adx-native-metrics
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: akernel-adx-native-metrics
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: akernel-adx-native-metrics
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: akernel-adx-native-metrics
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: akernel-adx-native-metrics
  template:
    metadata:
      labels:
        app: akernel-adx-native-metrics
      annotations:
        checksum/metrics-config: {{ include (print $.Template.BasePath "/adx/observability-metrics-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: akernel-adx-native-metrics
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: otelcol
          image: "{{ include "core.image" (dict "root" . "image" .Values.image) }}"
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/otelcol-contrib]
          args: [--config=/etc/akernel/adx-native-metrics.yaml]
          resources:
            {{- toYaml .Values.monitoring.adxCollectorResources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/akernel/adx-native-metrics.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: akernel-adx-native-metrics
{{- end }}
{{- if .Values.monitoring.lokiEndpoint }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: akernel-adx-control-logs
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    receivers:
      filelog:
        include: [/logs/*.log]
        exclude: ["**/*.gz"]
        start_at: beginning
    processors:
      resource:
        attributes:
          - key: adx_env
            value: {{ .Values.monitoring.akernelEnv | default "default" | quote }}
            action: upsert
          - key: akernel_env
            value: {{ .Values.monitoring.akernelEnv | default "default" | quote }}
            action: upsert
          - key: service.name
            value: ${env:ADX_LOG_SERVICE_NAME}
            action: upsert
      batch:
        timeout: 5s
    exporters:
      otlphttp/loki:
        endpoint: http://{{ .Values.monitoring.lokiEndpoint }}/otlp
    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [resource, batch]
          exporters: [otlphttp/loki]
{{- end }}
