apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitor.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  {{- $files := .Files.Glob "dashboards/*.json" }}
  {{- if $files }}
  {{- range $path, $file := $files }}
  {{- $dashboard := $.Files.Get $path | fromJson }}
  {{- if $.Values.grafanaServer.env.serveFromSubPath }}
  {{- range $link := $dashboard.links }}
  {{- if hasPrefix "/d/" ($link.url | default "") }}
  {{- $_ := set $link "url" (printf "/grafana%s" $link.url) }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{ base $path }}: |-
{{ $dashboard | toPrettyJson | indent 4 }}
  {{- end }}
  {{- end }}
